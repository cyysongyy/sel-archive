<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>會議資料庫</title>
<style>
:root{--pri:#4f46e5;--pril:#e0e7ff;--prid:#3730a3;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g400:#9ca3af;--g600:#4b5563;--g700:#374151;--g900:#111827}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--g50);color:var(--g900);line-height:1.6}
header{background:linear-gradient(135deg,var(--pri),var(--prid));color:#fff;padding:22px 16px 18px}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;opacity:.85;font-size:.9rem}
nav{display:flex;gap:8px;margin-top:14px}
nav button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:7px 16px;border-radius:20px;cursor:pointer;font-size:.9rem}
nav button.on{background:#fff;color:var(--prid);font-weight:700}
.bar{position:sticky;top:0;background:var(--g50);padding:12px 0 8px;z-index:5;border-bottom:1px solid var(--g200)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--g200);border-radius:10px;font:inherit;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:4px 13px;border-radius:16px;border:1px solid var(--g200);background:#fff;cursor:pointer;font-size:.85rem;color:var(--g600)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stat{font-size:.8rem;color:var(--g400);margin:6px 0 0}
h2.month{font-size:1rem;color:var(--prid);margin:22px 0 8px;padding-left:8px;border-left:4px solid var(--pri)}
.card{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.date{min-width:56px;text-align:center;background:var(--pril);border-radius:10px;padding:6px 4px;color:var(--prid)}
.date b{display:block;font-size:1.3rem;line-height:1.1}.date span{font-size:.72rem}
.body{flex:1;min-width:0}.body h3{margin:0 0 3px;font-size:1.02rem}
.body p{margin:2px 0 6px;font-size:.88rem;color:var(--g600)}
.tag{display:inline-block;font-size:.72rem;padding:1px 9px;border-radius:10px;background:var(--g100);color:var(--g600);margin:0 4px 4px 0}
.col{color:#fff!important}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:8px;padding:6px 13px;font-size:.84rem;cursor:pointer;text-decoration:none;display:inline-block;background:var(--pri);color:#fff}
.btn.o{background:#fff;color:var(--pri);border:1px solid var(--pri)}.btn.g{background:var(--g100);color:var(--g700)}.btn.r{background:#fff;color:var(--err);border:1px solid var(--err)}
.empty{text-align:center;color:var(--g400);padding:50px 0}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;padding:10px}
#modal .box{background:#fff;border-radius:14px;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#modal .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--g200);gap:8px}
#modal iframe{flex:1;border:0;width:100%}
.note{font-size:.8rem;color:var(--g400);padding:8px 14px}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px;color:var(--g700)}
.panel{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:16px;margin:16px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}.card{flex-direction:column;gap:8px}}
pre{background:var(--g900);color:#d1fae5;padding:12px;border-radius:10px;overflow:auto;font-size:.8rem;max-height:240px}
.hint{font-size:.82rem;color:var(--g600);background:var(--pril);padding:10px 12px;border-radius:10px;margin:10px 0}
footer{text-align:center;color:var(--g400);font-size:.78rem;padding:30px 0}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="siteTitle">會議資料庫</h1><p id="siteSub"></p>
  <nav><button id="nb" class="on" onclick="show('browse')">📚 瀏覽</button><button id="na" onclick="show('admin')">➕ 新增資料</button></nav>
</div></header>

<div class="wrap" id="browse">
  <div class="bar">
    <input id="q" placeholder="🔍 搜尋標題、摘要、標籤…" oninput="render()">
    <div class="chips" id="colChips"></div>
    <div class="chips" id="yearChips"></div>
    <div class="stat" id="stat"></div>
  </div>
  <div id="list"></div>
</div>

<div class="wrap" id="admin" style="display:none">
  <div class="panel">
    <div class="row">
      <div><label>日期</label><input type="date" id="fDate"></div>
      <div><label>類別</label><select id="fCol" onchange="if(this.value=='__new')newCol(true)"></select></div>
    </div>
    <label>標題（選填，不填則使用檔名）</label><input id="fTitle" placeholder="例：SEL 週會：同理心與班級經營">
    <label>選擇檔案（PPT／PDF，可從電腦、手機或雲端硬碟選取）</label>
    <input type="file" id="fFile" accept=".ppt,.pptx,.pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint,application/pdf">
    <div class="acts" style="margin-top:14px"><button class="btn" id="upBtn" onclick="upload()">⬆ 上傳到網站</button></div>
    <div id="upStat" class="stat" style="font-size:.88rem;margin-top:10px"></div>
  </div>
  <div class="panel"><b>目前清單（<span id="cnt"></span> 筆）</b><div id="adminList" style="margin-top:8px"></div></div>
  <div class="panel"><b>類別管理</b><div id="colList" style="margin:8px 0"></div><div class="acts"><button class="btn g" onclick="newCol()">＋ 新增類別</button><button class="btn r" onclick="logout()">登出管理</button></div></div>
</div>

<div id="modal"><div class="box">
  <div class="hd"><b id="mTitle" style="font-size:.95rem"></b><div class="acts" style="margin:0"><a class="btn o" id="mDl" download>⬇ 下載</a><button class="btn g" onclick="closeM()">✕ 關閉</button></div></div>
  <iframe id="mFrame" allowfullscreen></iframe>
  <div class="note">線上預覽使用 Microsoft Office 檢視器，需檔案已公開上傳至網路；若無法顯示請直接下載。</div>
</div></div>
<footer>會議資料庫・可擴充至各類會議與研習資料</footer>

<script>
const FALLBACK={siteTitle:"會議資料庫",siteSubtitle:"尚未載入資料",collections:[{id:"sel",name:"SEL 週會",color:"#4f46e5"}],items:[]};
let DB=FALLBACK, colF="all", yearF="all";
const $=id=>document.getElementById(id);
const colOf=id=>DB.collections.find(c=>c.id===id)||{name:id,color:"#9ca3af"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function load(){
  try{const r=await fetch("data/index.json?t="+Date.now());if(!r.ok)throw 0;DB=await r.json();}
  catch(e){DB=JSON.parse(localStorage.getItem("selDB")||"null")||FALLBACK;}
  $("siteTitle").textContent=DB.siteTitle;$("siteSub").textContent=DB.siteSubtitle||"";document.title=DB.siteTitle;
  fillCols();render();renderAdmin();
  // 預設日期：最近的週一
  const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));$("fDate").valueAsDate=d;
}
function fillCols(){
  const cur=$("fCol").value;$("fCol").innerHTML=DB.collections.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")+`<option value="__new">＋ 新增類別…</option>`;if(cur&&cur!="__new")$("fCol").value=cur;
}
async function show(v){
  if(v=="admin"&&!PW()&&!(await login()))return;$("browse").style.display=v=="browse"?"":"none";$("admin").style.display=v=="admin"?"":"none";$("nb").className=v=="browse"?"on":"";$("na").className=v=="admin"?"on":"";}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const years=[...new Set(DB.items.map(i=>i.date.slice(0,4)))].sort().reverse();
  $("colChips").innerHTML=[["all","全部"],...DB.collections.map(c=>[c.id,c.name])].map(([id,n])=>`<span class="chip ${colF==id?"on":""}" onclick="colF='${id}';render()">${esc(n)}</span>`).join("")+`<span class="chip" style="border-style:dashed;color:var(--pri)" onclick="newCol()">＋ 新增類別</span>`;
  $("yearChips").innerHTML=[["all","所有年度"],...years.map(y=>[y,y+" 年"])].map(([id,n])=>`<span class="chip ${yearF==id?"on":""}" onclick="yearF='${id}';render()">${n}</span>`).join("");
  const items=DB.items.filter(i=>(colF=="all"||i.collection==colF)&&(yearF=="all"||i.date.startsWith(yearF))&&(!q||[i.title,i.summary,(i.tags||[]).join(" ")].join(" ").toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
  $("stat").textContent=`共 ${items.length} 筆`;
  if(!items.length){$("list").innerHTML='<div class="empty">沒有符合的資料</div>';return;}
  let h="",cur="";
  for(const i of items){
    const m=i.date.slice(0,7);if(m!==cur){cur=m;h+=`<h2 class="month">${m.slice(0,4)} 年 ${+m.slice(5)} 月</h2>`;}
    const c=colOf(i.collection),dt=new Date(i.date+"T00:00:00"),wd="日一二三四五六"[dt.getDay()];
    h+=`<div class="card"><div class="date"><b>${+i.date.slice(8)}</b><span>週${wd}</span></div><div class="body">
      <h3>${esc(i.title)}</h3><span class="tag col" style="background:${c.color}">${esc(c.name)}</span>${(i.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}
      ${i.summary?`<p>${esc(i.summary)}</p>`:""}
      <div class="acts"><button class="btn" onclick="preview('${esc(i.id)}')">👁 線上預覽</button><a class="btn o" href="${esc(i.file)}" download>⬇ 下載 PPT</a><button class="btn r" onclick="delItem('${esc(i.id)}')">🗑 刪除</button>${i.audio?`<a class="btn g" href="${esc(i.audio)}" target="_blank" rel="noopener">🎧 錄音</a>`:""}</div></div></div>`;
  }
  $("list").innerHTML=h;
}
function absUrl(p){return new URL(p,location.href).href}
function preview(id){
  const i=DB.items.find(x=>x.id===id);if(!i)return;
  const u=absUrl(i.file);
  $("mTitle").textContent=i.date+"　"+i.title;$("mDl").href=i.file;
  $("mFrame").src=/\.pdf$/i.test(i.file)?i.file:"https://view.officeapps.live.com/op/embed.aspx?src="+encodeURIComponent(u);
  $("modal").style.display="block";
}
function closeM(){$("modal").style.display="none";$("mFrame").src="about:blank"}
/* ---- 管理 ---- */
const GAS_URL="https://script.google.com/macros/s/AKfycbxQSC5PLUVUYLYk_Fef1wKNuX5LTkpdwA6WFnp0OYF9aMfwEEoGWYjBXQsJw3rR6JLg/exec";
const PW=()=>localStorage.getItem("adminPw")||"";
async function gh(path,opt={}){
  if(!GAS_URL)throw new Error("尚未設定 GAS_URL");
  const r=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({pw:PW(),path,method:opt.method||"GET",body:opt.body||null})});
  const j=await r.json();
  const resp={ok:j.status>=200&&j.status<300,status:j.status,json:async()=>j.body};
  if(!resp.ok&&!(opt.allow404&&j.status==404)){
    if(j.status==401){localStorage.removeItem("adminPw")}
    throw new Error(j.status==401?"密碼錯誤":(j.status+" "+((j.body&&j.body.message)||"")))
  }
  return resp;
}
async function login(){
  const pw=(prompt("請輸入管理密碼")||"").trim();if(!pw)return false;
  localStorage.setItem("adminPw",pw);
  try{await gh("contents/data/index.json?t="+Date.now());return true}
  catch(e){localStorage.removeItem("adminPw");alert(e.message=="密碼錯誤"?"密碼錯誤":"連線失敗："+e.message);return false}
}
function logout(){localStorage.removeItem("adminPw");show("browse")}
const readB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)});
const st=(m,c)=>{$("upStat").style.color=c||"var(--g600)";$("upStat").textContent=m};
async function upload(){
  const date=$("fDate").value,col=$("fCol").value,f=$("fFile").files[0];
  if(!date||!f){alert("請選擇日期與檔案");return}
  const title=$("fTitle").value.trim()||f.name.replace(/\.[^.]+$/,"");
  if(!PW()){alert("請先登入管理");return}
  const ext=(f.name.split(".").pop()||"pptx").toLowerCase();
  $("upBtn").disabled=true;
  try{
    let fname=`${date}-${col}.${ext}`;
    st("檢查檔名…");
    const ex=await gh("contents/files/"+fname,{allow404:true});
    if(ex.status!=404)fname=`${date}-${col}-${Date.now().toString(36).slice(-3)}.${ext}`;
    st("上傳檔案中…（"+(f.size/1048576).toFixed(1)+" MB）");
    await gh("contents/files/"+fname,{method:"PUT",body:JSON.stringify({message:"add "+fname,content:await readB64(f)})});
    st("更新清單中…");
    const jr=await (await gh("contents/data/index.json?t="+Date.now())).json();
    const db=JSON.parse(decodeURIComponent(escape(atob(jr.content.replace(/\n/g,"")))));
    let id=`${date}-${col}`;if(db.items.some(i=>i.id===id))id+="-"+Date.now().toString(36).slice(-3);
    db.items.push({id,date,collection:col,title,file:"files/"+fname});
    await gh("contents/data/index.json",{method:"PUT",body:JSON.stringify({message:"add item "+id,sha:jr.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2))))})});
    DB=db;render();renderAdmin();fillCols();
    $("fTitle").value="";$("fFile").value="";
    st("✅ 上傳完成！網站約 1–2 分鐘後更新（可按 Ctrl+F5 重新整理）。","var(--ok)");
  }catch(e){st("❌ 失敗："+e.message+"（請確認密碼與網路）","var(--err)")}
  $("upBtn").disabled=false;
}
async function newCol(fromSelect){
  const n=(prompt("請輸入新類別名稱（例如：家長座談會）")||"").trim();
  if(!n){if(fromSelect)fillCols();return}
  if(DB.collections.some(c=>c.name===n)){alert("已有同名類別");if(fromSelect)fillCols();return}
  if(!PW()&&!(await login())){if(fromSelect)fillCols();return}
  try{
    const jr=await (await gh("contents/data/index.json?t="+Date.now())).json();
    const db=JSON.parse(decodeURIComponent(escape(atob(jr.content.replace(/\n/g,"")))));
    const pal=["#4f46e5","#0ea5e9","#10b981","#f59e0b","#ec4899","#8b5cf6","#14b8a6"];
    const id="c"+Date.now().toString(36);
    db.collections.push({id,name:n,color:pal[db.collections.length%pal.length]});
    await gh("contents/data/index.json",{method:"PUT",body:JSON.stringify({message:"add collection "+n,sha:jr.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2))))})});
    DB=db;fillCols();if(fromSelect)$("fCol").value=id;render();
  }catch(e){alert("失敗："+e.message);if(fromSelect)fillCols()}
}
async function delCol(id){
  const c=colOf(id);
  if(DB.items.some(i=>i.collection==id)){alert("「"+c.name+"」底下還有資料，請先移除或改類別後再刪除");return}
  if(!confirm("刪除類別「"+c.name+"」？"))return;
  try{
    const jr=await (await gh("contents/data/index.json?t="+Date.now())).json();
    const db=JSON.parse(decodeURIComponent(escape(atob(jr.content.replace(/\n/g,"")))));
    db.collections=db.collections.filter(x=>x.id!=id);
    await gh("contents/data/index.json",{method:"PUT",body:JSON.stringify({message:"remove collection "+id,sha:jr.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2))))})});
    DB=db;if(colF==id)colF="all";fillCols();render();renderAdmin();
  }catch(e){alert("失敗："+e.message)}
}
async function delItem(id){
  const it=DB.items.find(x=>x.id===id);if(!it)return;
  if(!confirm("刪除「"+it.title+"」？\n資料與 PPT 檔案都會刪除，無法復原。"))return;
  if(!PW()&&!(await login()))return;
  try{
    const jr=await (await gh("contents/data/index.json?t="+Date.now())).json();
    const db=JSON.parse(decodeURIComponent(escape(atob(jr.content.replace(/\n/g,"")))));
    db.items=db.items.filter(i=>i.id!==id);
    await gh("contents/data/index.json",{method:"PUT",body:JSON.stringify({message:"remove "+id,sha:jr.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2))))})});
    DB=db;render();renderAdmin();
    let fileMsg="";
    if(/^files\/[^\/?]+$/.test(it.file)&&!db.items.some(i=>i.file===it.file)){
      try{
        const fr=await (await gh("contents/"+it.file+"?t="+Date.now())).json();
        await gh("contents/"+it.file,{method:"DELETE",body:JSON.stringify({message:"delete "+it.file,sha:fr.sha})});
      }catch(e){fileMsg="\n（清單已移除，但 PPT 檔案未能刪除："+e.message+"）"}
    }
    alert("已刪除"+fileMsg);
  }catch(e){alert("失敗："+e.message)}
}
function renderAdmin(){
  $("cnt").textContent=DB.items.length;
  $("colList").innerHTML=DB.collections.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--g100);font-size:.9rem"><span><span class="tag col" style="background:${c.color}">${esc(c.name)}</span></span><button class="btn r" onclick="delCol('${esc(c.id)}')">刪除</button></div>`).join("");
  $("adminList").innerHTML=[...DB.items].sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--g100);font-size:.88rem"><span>${i.date}　${esc(i.title)}</span><span style="display:flex;gap:6px;flex-shrink:0"><button class="btn o" onclick="preview('${esc(i.id)}')">線上預覽</button><button class="btn r" onclick="delItem('${esc(i.id)}')">移除</button></span></div>`).join("")||"（空）";
}
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
load();
</script>
</body>
</html>
