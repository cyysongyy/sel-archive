<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<title>會議資料庫</title>
<style>
:root{--bg:#f4f5fa;--surface:#fff;--ink:#0f172a;--ink2:#475569;--muted:#94a3b8;--line:#e5e7f0;
--pri:#4338ca;--prid:#312e81;--pril:#eef0ff;--ok:#059669;--warn:#d97706;--err:#dc2626;
--g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;--g400:#94a3b8;--g600:#475569;--g700:#334155;--g900:#0f172a;
--r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 1px 1px rgba(15,23,42,.03);--shh:0 14px 30px -16px rgba(49,46,129,.35),0 2px 6px rgba(15,23,42,.05)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-3px}
/* header */
header{position:relative;color:#fff;padding:34px 0 0;background:radial-gradient(1200px 400px at 85% -20%,rgba(129,140,248,.45),transparent 60%),linear-gradient(135deg,#1e1b4b 0%,#312e81 55%,#3730a3 100%);overflow:hidden}
header:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,#000,transparent 85%);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 85%)}
header .wrap{position:relative}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(6px)}
.logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
header h1{margin:0;font-size:1.65rem;font-weight:800;letter-spacing:.04em;line-height:1.25}
header p{margin:2px 0 0;font-size:.92rem;color:rgba(255,255,255,.72);letter-spacing:.02em}
.hstats{display:flex;gap:28px;margin:22px 0 0;flex-wrap:wrap}
.hstats div{display:flex;flex-direction:column}
.hstats b{font-size:1.45rem;font-weight:700;line-height:1.2}
.hstats span{font-size:.76rem;color:rgba(255,255,255,.62);letter-spacing:.08em}
nav{display:flex;gap:4px;margin-top:22px}
nav button{display:inline-flex;align-items:center;gap:7px;background:transparent;color:rgba(255,255,255,.72);border:0;padding:12px 18px;cursor:pointer;font:inherit;font-size:.92rem;border-bottom:3px solid transparent;transition:.15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;font-weight:700;border-bottom-color:#fff;background:linear-gradient(to top,rgba(255,255,255,.12),transparent)}
/* filter bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(244,245,250,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:16px 0 10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round}
.search input{padding-left:42px;height:46px}
input,select,textarea{width:100%;padding:10px 13px;border:1px solid var(--g200);border-radius:11px;font:inherit;font-size:.93rem;background:#fff;color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(67,56,202,.14)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.84rem;color:var(--ink2);transition:.15s;user-select:none}
.chip:hover{border-color:#c7cbe8;color:var(--ink)}
.chip.on{background:var(--prid);color:#fff;border-color:var(--prid);box-shadow:0 4px 12px -4px rgba(49,46,129,.5)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.stat{font-size:.8rem;color:var(--muted);margin:10px 0 0}
/* list */
h2.month{display:flex;align-items:center;gap:12px;font-size:.95rem;font-weight:700;color:var(--ink);margin:30px 0 14px;letter-spacing:.03em}
h2.month:after{content:"";flex:1;height:1px;background:var(--line)}
h2.month small{font-weight:500;color:var(--muted);font-size:.78rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;display:flex;gap:18px;align-items:flex-start;box-shadow:var(--sh);transition:box-shadow .2s,transform .2s,border-color .2s}
.card:hover{box-shadow:var(--shh);transform:translateY(-2px);border-color:#d5d8ef}
.date{width:60px;flex-shrink:0;text-align:center;background:var(--pril);border-radius:12px;padding:8px 0 7px;color:var(--prid);line-height:1.15}
.date .mo{display:block;font-size:.68rem;font-weight:600;letter-spacing:.1em;opacity:.75}
.date b{display:block;font-size:1.6rem;font-weight:800;margin:1px 0}
.date .wd{display:block;font-size:.7rem;font-weight:600;opacity:.75}
.body{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.body h3{margin:0;font-size:1.08rem;font-weight:700;line-height:1.45;color:var(--ink);word-break:break-word}
.body p{margin:6px 0 0;font-size:.88rem;color:var(--ink2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--g100);color:var(--ink2);letter-spacing:.02em}
.tag.col .dot{width:6px;height:6px;background:currentColor}
.tag.type{border-radius:6px;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:700;letter-spacing:.06em;padding:1px 7px}
.tag.new{background:#dcfce7;color:#166534}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.acts .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:8px 15px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer;text-decoration:none;background:var(--pri);color:#fff;transition:.15s;line-height:1.2}
.btn:hover{background:var(--prid);box-shadow:0 6px 14px -6px rgba(49,46,129,.6)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.o{background:#fff;color:var(--pri);border-color:#c7cbe8}.btn.o:hover{background:var(--pril);box-shadow:none}
.btn.g{background:var(--g100);color:var(--g700)}.btn.g:hover{background:var(--g200);box-shadow:none}
.btn.r{background:#fff;color:var(--err);border-color:#fecaca}.btn.r:hover{background:#fef2f2;box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border-color:transparent;padding:8px 10px}.btn.ghost:hover{background:#fef2f2;color:var(--err);box-shadow:none}
.empty{text-align:center;color:var(--muted);padding:70px 0;font-size:.95rem}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.62);backdrop-filter:blur(4px);z-index:20;padding:14px}
#modal .box{background:#fff;border-radius:16px;height:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
#modal .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px}
#modal iframe{flex:1;border:0;width:100%;background:var(--g100)}
#pdfv{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#e8eaf1;padding:14px}
#pdfv .pg{width:100%;max-width:980px;margin:0 auto 14px;background:#fff;box-shadow:0 2px 12px rgba(15,23,42,.14);border-radius:4px;overflow:hidden}
#pdfv canvas{display:block;width:100%;height:auto}
.note{font-size:.78rem;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line)}
/* admin */
label{display:block;font-size:.82rem;font-weight:600;margin:14px 0 6px;color:var(--g700)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:18px 0;box-shadow:var(--sh)}
.panel>b:first-child{display:block;font-size:.98rem;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:.84rem;color:var(--g700);background:var(--pril);padding:11px 14px;border-radius:11px;margin:12px 0;border:1px solid #dfe3ff}
#drop{border:1.5px dashed #c3c8ea;border-radius:14px;padding:34px 14px;text-align:center;color:var(--ink2);cursor:pointer;background:linear-gradient(180deg,#fbfbff,#f4f5ff);transition:.15s;font-size:.95rem}
#drop:hover{border-color:var(--pri);background:var(--pril)}
.qrow{display:grid;grid-template-columns:1fr 150px 140px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--g100);font-size:.88rem}
.qrow input,.qrow select{padding:7px 10px;font-size:.85rem}
pre{background:var(--g900);color:#d1fae5;padding:12px;border-radius:10px;overflow:auto;font-size:.8rem;max-height:240px}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:44px 0 36px;letter-spacing:.04em}
@media(max-width:620px){.wrap{padding:0 14px}header{padding-top:24px}header h1{font-size:1.35rem}.hstats{gap:20px}.card{padding:15px;gap:13px}.date{width:52px}.date b{font-size:1.35rem}.row{grid-template-columns:1fr}.qrow{grid-template-columns:1fr 1fr}.qrow .qt{grid-column:1/3}.acts .sp{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M9 7.5h6M9 11h4"/></svg></div>
    <div><h1 id="siteTitle">會議資料庫</h1><p id="siteSub"></p></div></div>
  <div class="hstats" id="hstats"></div>
  <nav><button id="nb" class="on" onclick="show('browse')"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>瀏覽</button><button id="na" onclick="show('admin')"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>上傳管理</button></nav>
</div></header>

<div class="wrap" id="browse">
  <div id="notice"></div>
  <div class="bar">
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="搜尋標題或標籤…" oninput="render()"></div>
    <div class="chips" id="colChips"></div>
    <div class="chips" id="yearChips"></div>
    <div class="stat" id="stat"></div>
  </div>
  <div id="list"></div>
</div>

<div class="wrap" id="admin" style="display:none">
  <div class="panel">
    <div id="drop" onclick="$('fFile').click()">
      <svg class="i" style="width:26px;height:26px;display:block;margin:0 auto 8px;color:var(--pri)" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><b style="color:var(--ink)">點此選擇檔案，或把 PPT／PDF 拖曳到這裡</b><br><small style="color:var(--muted)">可一次多個　・　日期、類別、標題由系統從檔名自動偵測</small>
    </div>
    <input type="file" id="fFile" multiple style="display:none" onchange="addFiles(this.files)" accept=".ppt,.pptx,.pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint,application/pdf">
    <div id="queue" style="margin-top:10px"></div>
    <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px"><input type="checkbox" id="autoUp" checked style="width:auto"> 檔名含日期時，選好檔案後自動上傳</label>
    <div class="acts" style="margin-top:12px"><button class="btn" id="upBtn" onclick="uploadAll()">⬆ 上傳到網站</button></div>
    <div id="upStat" class="stat" style="font-size:.88rem;margin-top:10px"></div>
  </div>
  <div class="panel"><b>目前清單（<span id="cnt"></span> 筆）</b><div id="adminList" style="margin-top:8px"></div></div>
  <div class="panel"><b>類別管理</b><div id="colList" style="margin:8px 0"></div><div class="acts"><button class="btn g" onclick="newCol()">＋ 新增類別</button><button class="btn r" onclick="logout()">登出管理</button></div></div>
</div>

<div id="modal"><div class="box">
  <div class="hd"><div style="min-width:0"><b id="mTitle" style="font-size:.95rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b><span id="mPages" style="font-size:.76rem;color:var(--muted)"></span></div><div class="acts" style="margin:0;flex-shrink:0"><a class="btn o" id="mOpen" target="_blank" rel="noopener" style="display:none">新分頁開啟</a><a class="btn o" id="mDl" download>下載</a><button class="btn g" onclick="closeM()">關閉</button></div></div>
  <iframe id="mFrame" allowfullscreen></iframe>
  <div id="pdfv" style="display:none"></div>
  <div class="note" id="mNote"></div>
</div></div>
<footer>會議資料庫 ・ 讓每一次會議的成果都能被找到</footer>

<script>
const FALLBACK={siteTitle:"會議資料庫",siteSubtitle:"尚未載入資料",collections:[{id:"sel",name:"SEL 週會",color:"#4f46e5"}],items:[]};
let DB=FALLBACK, colF="all", yearF="all";
const $=id=>document.getElementById(id);
const IC={eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
dl:'<svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>',
trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>',
mic:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'};
const colOf=id=>DB.collections.find(c=>c.id===id)||{name:id,color:"#9ca3af"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

async function load(){
  try{const r=await fetch("data/index.json?t="+Date.now());if(!r.ok)throw 0;DB=await r.json();}
  catch(e){DB=JSON.parse(localStorage.getItem("selDB")||"null")||FALLBACK;}
  $("siteTitle").textContent=DB.siteTitle;$("siteSub").textContent=DB.siteSubtitle||"";document.title=DB.siteTitle;
  fillCols();render();renderAdmin();
  // 預設日期：最近的週一
  setupDrop();
}
function fillCols(){renderQueue()}
async function show(v){
  if(v=="admin"&&!PW()&&!(await login()))return;$("browse").style.display=v=="browse"?"":"none";$("admin").style.display=v=="admin"?"":"none";$("nb").className=v=="browse"?"on":"";$("na").className=v=="admin"?"on":"";}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const years=[...new Set(DB.items.map(i=>i.date.slice(0,4)))].sort().reverse();
  $("colChips").innerHTML=[["all","全部"],...DB.collections.map(c=>[c.id,c.name])].map(([id,n])=>`<span class="chip ${colF==id?"on":""}" onclick="colF='${id}';render()">${id!="all"?`<i class="dot" style="background:${colOf(id).color}"></i>`:""}${esc(n)}</span>`).join("")+`<span class="chip" style="border-style:dashed;color:var(--pri)" onclick="newCol()">＋ 新增類別</span>`+(colF!="all"&&DB.collections.some(c=>c.id==colF)?`<span class="chip" style="color:var(--g600)" onclick="renameCol('${colF}')">✎ 改名「${esc(colOf(colF).name)}」</span><span class="chip" style="color:var(--err);border-color:var(--err)" onclick="delCol('${colF}')">🗑 刪除此類別</span>`:"");
  $("yearChips").innerHTML=[["all","所有年度"],...years.map(y=>[y,y+" 年"])].map(([id,n])=>`<span class="chip ${yearF==id?"on":""}" onclick="yearF='${id}';render()">${n}</span>`).join("");
  const items=DB.items.filter(i=>(colF=="all"||i.collection==colF)&&(yearF=="all"||i.date.startsWith(yearF))&&(!q||[i.title,i.summary,(i.tags||[]).join(" ")].join(" ").toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
  $("stat").textContent=`顯示 ${items.length} 筆`;weeklyNotice();
  {const yr=String(new Date().getFullYear()),last=DB.items.map(i=>i.date).sort().pop();
   $("hstats").innerHTML=`<div><b>${DB.items.length}</b><span>資料總數</span></div><div><b>${DB.items.filter(i=>i.date.startsWith(yr)).length}</b><span>${yr} 年度</span></div><div><b>${last?last.slice(5).replace("-","/"):"—"}</b><span>最近一次</span></div>`}
  if(!items.length){$("list").innerHTML='<div class="empty">沒有符合的資料</div>';return;}
  const cnt={};items.forEach(i=>{const k=i.date.slice(0,7);cnt[k]=(cnt[k]||0)+1});
  let h="",cur="";
  for(const i of items){
    const m=i.date.slice(0,7);if(m!==cur){cur=m;h+=`<h2 class="month">${m.slice(0,4)} 年 ${+m.slice(5)} 月 <small>${cnt[m]} 筆</small></h2>`;}
    const c=colOf(i.collection),dt=new Date(i.date+"T00:00:00"),wd="日一二三四五六"[dt.getDay()],age=(Date.now()-dt)/864e5,ext=((i.file||"").split(".").pop()||"").toUpperCase();
    h+=`<article class="card"><div class="date"><span class="mo">${+i.date.slice(5,7)} 月</span><b>${+i.date.slice(8)}</b><span class="wd">週${wd}</span></div><div class="body">
      <div class="meta"><span class="tag col" style="background:${c.color}1f;color:${c.color}"><i class="dot"></i>${esc(c.name)}</span><span class="tag type">${esc(ext)}</span>${i.pages?`<span class="tag type">${i.pages} 頁</span>`:""}${age>=0&&age<=7?'<span class="tag new">NEW</span>':""}${(i.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
      <h3>${esc(i.title)}</h3>
      ${i.summary?`<p>${esc(i.summary)}</p>`:""}
      <div class="acts"><button class="btn" onclick="preview('${esc(i.id)}')">${IC.eye}線上預覽</button><a class="btn o" href="${esc(i.file)}" download>${IC.dl}下載</a>${i.audio?`<a class="btn g" href="${esc(i.audio)}" target="_blank" rel="noopener">${IC.mic}錄音</a>`:""}<span class="sp"></span><button class="btn ghost" title="刪除" onclick="delItem('${esc(i.id)}')">${IC.trash}</button></div></div></article>`;
  }
  $("list").innerHTML=h;
}
function absUrl(p){return new URL(p,location.href).href}
let pdfP=null,pdfTok=0;
function loadPdfJs(){
  if(pdfP)return pdfP;
  pdfP=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok(pdfjsLib)};
    s.onerror=()=>{pdfP=null;no()};document.head.appendChild(s)});
  return pdfP;
}
async function showPdf(url){
  const tok=++pdfTok,box=$("pdfv");box.innerHTML='<div class="empty">載入中…</div>';
  try{
    const lib=await loadPdfJs(),doc=await lib.getDocument(url).promise;if(tok!==pdfTok)return;
    box.innerHTML="";$("mPages").textContent="共 "+doc.numPages+" 頁";
    const v1=(await doc.getPage(1)).getViewport({scale:1});
    const io=new IntersectionObserver(es=>es.forEach(async e=>{
      if(!e.isIntersecting)return;const d=e.target;io.unobserve(d);
      const pg=await doc.getPage(+d.dataset.n);if(tok!==pdfTok)return;
      const base=pg.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2),vp=pg.getViewport({scale:d.clientWidth/base.width*dpr});
      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;if(tok!==pdfTok)return;
      d.style.aspectRatio="auto";d.innerHTML="";d.appendChild(c);
    }),{root:box,rootMargin:"800px 0px"});

function detectCol(name,text){

async function extractInfo(f){

    if(/\.pptx$/i.test(f.name)&&typeof JSZip!=="undefined"){

      r.pages=names.length;

        const doc=new DOMParser().parseFromString(await z.file(n).async("string"),"application/xml");
        const txt=sp=>[...sp.getElementsByTagName("a:t")].map(t=>t.textContent).join("").replace(/\s+/g," ").trim();
        const sps=[...doc.getElementsByTagName("p:sp")];let t="";
        for(const sp of sps){const ph=sp.getElementsByTagName("p:ph")[0];if(ph&&/title/i.test(ph.getAttribute("type")||"")){t=txt(sp);if(t)break}}
        if(!t)for(const sp of sps){t=txt(sp);if(t)break}

      }
      const core=z.file("docProps/core.xml");

      for(let p=1;p<=Math.min(doc.numPages,15);p++){
        const c=await (await doc.getPage(p)).getTextContent(),its=c.items.filter(i=>i.str&&i.str.trim());
        if(!its.length){titles.push("");texts.push("");continue}
        const mh=Math.max(...its.map(i=>Math.abs(i.transform[3])||0));
        titles.push(its.filter(i=>(Math.abs(i.transform[3])||0)>=mh*.9).map(i=>i.str).join("").replace(/\s+/g," ").trim());
        texts.push(its.map(i=>i.str).join(" "));
      }
      if(texts.join("").trim().length<30){try{await ocrPdf(doc,f.name,r,titles,texts)}catch(e){st("文字辨識無法使用："+e.message)}}
    }
  }catch(e){}

    const jr=await (await gh("contents/data/index.json?t="+Date.now())).json();
    const db=JSON.parse(decodeURIComponent(escape(atob(jr.content.replace(/\n/g,"")))));
    db.items=db.items.filter(i=>i.id!==id);
    await gh("contents/data/index.json",{method:"PUT",body:JSON.stringify({message:"remove "+id,sha:jr.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,2))))})});
    DB=db;render();renderAdmin();
    let fileMsg="";
    if(/^files\/[^\/?]+$/.test(it.file)&&!db.items.some(i=>i.file===it.file)){
      try{
        const fr=await (await gh("contents/"+it.file+"?t="+Date.now())).json();
        await gh("contents/"+it.file,{method:"DELETE",body:JSON.stringify({message:"delete "+it.file,sha:fr.sha})});
      }catch(e){fileMsg="\n（清單已移除，但 PPT 檔案未能刪除："+e.message+"）"}
    }
    alert("已刪除"+fileMsg);
  }catch(e){alert("失敗："+e.message)}
}
function renderAdmin(){
  $("cnt").textContent=DB.items.length;
  $("colList").innerHTML=DB.collections.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--g100);font-size:.9rem"><span><span class="tag col" style="background:${c.color}1f;color:${c.color}"><i class="dot"></i>${esc(c.name)}</span></span><span style="display:flex;gap:6px"><button class="btn o" onclick="renameCol('${esc(c.id)}')">改名</button><button class="btn r" onclick="delCol('${esc(c.id)}')">刪除</button></span></div>`).join("");
  $("adminList").innerHTML=[...DB.items].sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--g100);font-size:.88rem"><span>${i.date}　${esc(i.title)}</span><span style="display:flex;gap:6px;flex-shrink:0"><button class="btn o" onclick="preview('${esc(i.id)}')">${IC.eye}預覽</button><button class="btn r" onclick="delItem('${esc(i.id)}')">${IC.trash}刪除</button></span></div>`).join("")||"（空）";
}
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
function lastMonday(){
  const n=new Date(),d=new Date(n);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));
  const end=new Date(d);end.setHours(17,30,0,0);
  if(n<end)d.setDate(d.getDate()-7);
  return iso(d);
}
function weeklyNotice(){
  const el=$("notice");if(!el)return;
  const m=lastMonday();
  if(!PW()||DB.items.some(i=>i.date===m)){el.innerHTML="";return}
  el.innerHTML=`<div class="hint" style="background:#fef3c7;color:#92400e;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px"><span>📌 ${+m.slice(5,7)}/${+m.slice(8)}（週一）的會議資料尚未上傳</span><button class="btn" onclick="show('admin')">前往上傳</button></div>`;
}
setInterval(async()=>{
  if(uploading||document.hidden)return;
  try{const r=await fetch("data/index.json?t="+Date.now());if(!r.ok)return;const n=await r.json();
    if(JSON.stringify(n)!==JSON.stringify(DB)){DB=n;fillCols();render();renderAdmin();weeklyNotice()}}catch(e){}
},300000);

load();
</script>
